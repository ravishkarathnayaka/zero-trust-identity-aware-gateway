# ==============================================================================
# Production-Hardened Envoy Configuration with Local Rate Limiting & ext_authz
# Protects ZTNA Gateway from Credential Stuffing & DoS Attacks
# ==============================================================================
static_resources:
  listeners:
    - name: https_hardened_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/server.crt
                    private_key:
                      filename: /etc/envoy/certs/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ztna_hardened_pep
                codec_type: AUTO
                http_filters:
                  # 1. Local Rate Limiting Filter (Token Bucket: 50 max, 20/sec refill)
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 50
                        tokens_per_fill: 20
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-local-rate-limit
                            value: 'true'

                  # 2. ExtAuthz Zero Trust Authorization Filter
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://ext_authz:9001
                          cluster: ext_authz
                          timeout: 2.0s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-device-posture
                              - prefix: x-
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-user-id
                              - exact: x-user-roles
                              - exact: x-auth-decision
                              - exact: x-ztna-policy
                      failure_mode_allow: false
                      transport_api_version: V3

                  # 3. Router
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                route_config:
                  name: protected_routes
                  virtual_hosts:
                    - name: ztna_backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/finance" }
                          route: { cluster: finance_api }
                        - match: { prefix: "/api/dev" }
                          route: { cluster: dev_portal }
                        - match: { prefix: "/healthz" }
                          route: { cluster: ext_authz }

  clusters:
    - name: ext_authz
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ext_authz, port_value: 9001 }
    - name: finance_api
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: finance_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: finance_api, port_value: 5001 }
    - name: dev_portal
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: dev_portal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dev_portal, port_value: 5002 }
