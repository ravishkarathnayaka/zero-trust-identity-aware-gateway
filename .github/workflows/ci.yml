name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  opa-policy-tests:
    name: OPA Rego Policy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Open Policy Agent
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'latest'

      - name: Run OPA Policy Unit Tests
        run: |
          echo "Executing OPA unit tests across policies directory..."
          opa test policies/ -v

  python-unit-tests:
    name: Python Middleware & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r gateway/ext_authz_service/requirements.txt
          pip install -r services/finance_api/requirements.txt
          pip install -r services/dev_portal/requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 120
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --cov=gateway/ext_authz_service

  docker-compose-validate:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Certificates for Compose Validation
        run: |
          chmod +x docker/certs/generate_certs.sh
          ./docker/certs/generate_certs.sh

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config
